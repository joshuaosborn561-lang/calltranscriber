[build]
# Railpack is Railway's current default builder and ignores nixpacks.toml.
# ffmpeg is installed by railpack.json (apt) for this builder.
# Fallback: nixpacks.toml (Nixpacks) and Dockerfile (switch builder to DOCKERFILE).
builder = "RAILPACK"

[deploy]
startCommand = "npm start"
# Always-on worker polling Drive (~30s) for ~60s transcript turnaround.
# cronSchedule intentionally unset.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
