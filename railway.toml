[build]
# PR #2 set RAILPACK, which made Railway ignore the Dockerfile.
# Railpack then did not apply railpack.json aptPackages (build logs had
# no ffmpeg install; runtime still ENOENT). Force the Dockerfile builder
# so apt-get install ffmpeg is part of the image and the build fails
# if `ffmpeg -version` does not succeed.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
# Always-on worker polling Drive (~30s) for ~60s transcript turnaround.
# cronSchedule intentionally unset.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
